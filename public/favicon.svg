<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="circGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Hex/Circle Grid Subtle Silhouette -->
  <rect width="100" height="100" rx="24" fill="#090d16" />

  <!-- Outer circular trajectory scan -->
  <circle cx="50" cy="50" r="38" stroke="url(#circGrad)" stroke-width="2.5" stroke-dasharray="8 4" stroke-opacity="0.4" />
  
  <!-- Interlocking Circular Arch & Steel I-Beam Voxel Icon -->
  <path d="M 28 50 C 28 37.85 37.85 28 50 28 C 62.15 28 72 37.85 72 50 C 72 58 67 65 60 69 L 55 63 C 59.5 60 63 55.5 63 50 C 63 42.82 57.18 37 50 37 C 42.82 37 37 42.82 37 50 C 37 57.18 42.82 63 50 63 L 50 72 C 37.85 72 28 62.15 28 50 Z" 
        fill="url(#circGrad)" />

  <!-- Laser LiDAR Reticle & Corner Targeting Brackets -->
  <path d="M 45 50 L 55 50 M 50 45 L 50 55" stroke="#22d3ee" stroke-width="2.5" stroke-linecap="round" filter="url(#glow)" />
  
  <path d="M 32 36 L 32 32 L 36 32" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <path d="M 68 36 L 68 32 L 64 32" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <path d="M 32 64 L 32 68 L 36 68" stroke="#34d399" stroke-width="2" stroke-linecap="round" />
  <path d="M 68 64 L 68 68 L 64 68" stroke="#34d399" stroke-width="2" stroke-linecap="round" />

  <!-- Scanning Sensor Node Dot -->
  <circle cx="68" cy="40" r="3.5" fill="#22d3ee" filter="url(#glow)" />
</svg>
